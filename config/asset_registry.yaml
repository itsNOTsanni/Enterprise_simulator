# ============================================================
# SIMULATED ENTERPRISE ASSET REGISTRY
# ============================================================

registry:
  registry_id: REG-001
  version: "1.0"
  last_updated: "2026-08-19"
  maintained_by: "Integration Team"


# ============================================================
# ENTERPRISE INFORMATION
# ============================================================

enterprise:
  enterprise_id: ENT-001
  name: Simulated Enterprise
  environment: isolated_lab

  description: >
    Controlled simulated enterprise environment for cybersecurity
    monitoring, attack simulation, detection, correlation,
    risk assessment, and response.


# ============================================================
# ENTERPRISE NETWORK
# ============================================================

network:
  network_id: NET-001
  name: enterprise-network
  cidr: 10.10.1.0/24
  gateway: 10.10.1.1
  dns: 10.10.1.1


# ============================================================
# PROTECTED ENTERPRISE ASSET REGISTRY
# ============================================================

assets:

  # ----------------------------------------------------------
  # WEB SERVER
  # ----------------------------------------------------------

  - asset_id: WEB-01
    asset_type: web_server
    hostname: web-01
    ip_address: 10.10.1.10

    # Logical enterprise asset profile.
    # Actual container/runtime platform may differ.
    os: Ubuntu

    technology:
      - Flask
      - Nginx

    owner_department: IT

    criticality: HIGH
    status: ACTIVE

    services:
      - service: HTTP
        port: 80
        protocol: TCP

      - service: HTTPS
        port: 443
        protocol: TCP

    communicates_with:
      - DB-01
      - END-01
      - END-02
      - END-03
      - END-04


  # ----------------------------------------------------------
  # DATABASE SERVER
  # ----------------------------------------------------------

  - asset_id: DB-01
    asset_type: database_server
    hostname: db-01
    ip_address: 10.10.1.20

    # Logical enterprise asset profile.
    os: Ubuntu

    technology:
      - PostgreSQL

    owner_department: IT

    criticality: CRITICAL
    status: ACTIVE

    services:
      - service: PostgreSQL
        port: 5432
        protocol: TCP

    communicates_with:
      - WEB-01
      - END-03


  # ----------------------------------------------------------
  # EMPLOYEE ENDPOINT 01
  # ----------------------------------------------------------

  - asset_id: END-01
    asset_type: employee_workstation
    hostname: employee-01
    ip_address: 10.10.1.31

    # Logical enterprise asset profile.
    os: Windows

    owner_employee: EMP-001
    owner_department: Finance

    criticality: MEDIUM
    status: ACTIVE

    communicates_with:
      - WEB-01
      - CLOUD-01


  # ----------------------------------------------------------
  # EMPLOYEE ENDPOINT 02
  # ----------------------------------------------------------

  - asset_id: END-02
    asset_type: employee_workstation
    hostname: employee-02
    ip_address: 10.10.1.32

    # Logical enterprise asset profile.
    os: Windows

    owner_employee: EMP-002
    owner_department: HR

    criticality: MEDIUM
    status: ACTIVE

    communicates_with:
      - WEB-01
      - CLOUD-01


  # ----------------------------------------------------------
  # EMPLOYEE ENDPOINT 03
  # ----------------------------------------------------------

  - asset_id: END-03
    asset_type: employee_workstation
    hostname: employee-03
    ip_address: 10.10.1.33

    # Logical enterprise asset profile.
    os: Windows

    owner_employee: EMP-003
    owner_department: IT

    criticality: HIGH
    status: ACTIVE

    communicates_with:
      - WEB-01
      - DB-01
      - CLOUD-01


  # ----------------------------------------------------------
  # EMPLOYEE ENDPOINT 04
  # ----------------------------------------------------------

  - asset_id: END-04
    asset_type: employee_workstation
    hostname: employee-04
    ip_address: 10.10.1.34

    # Logical enterprise asset profile.
    os: Windows

    owner_employee: EMP-004
    owner_department: Sales

    criticality: MEDIUM
    status: ACTIVE

    communicates_with:
      - WEB-01
      - CLOUD-01


  # ----------------------------------------------------------
  # CLOUD ENVIRONMENT
  # ----------------------------------------------------------

  - asset_id: CLOUD-01
    asset_type: cloud_environment
    hostname: cloud-01
    ip_address: 10.10.1.40

    technology:
      - Simulated Cloud

    owner_department: IT

    criticality: HIGH
    status: ACTIVE

    communicates_with:
      - END-01
      - END-02
      - END-03
      - END-04


# ============================================================
# EMPLOYEE / USER REGISTRY
# ============================================================

employees:

  # ----------------------------------------------------------
  # EMPLOYEE 01
  # ----------------------------------------------------------

  - employee_id: EMP-001
    username: employee01
    display_name: Employee 1

    department: Finance
    role: Employee

    workstation_id: END-01

    access_profile: finance_user

    status: ACTIVE


  # ----------------------------------------------------------
  # EMPLOYEE 02
  # ----------------------------------------------------------

  - employee_id: EMP-002
    username: employee02
    display_name: Employee 2

    department: HR
    role: Employee

    workstation_id: END-02

    access_profile: hr_user

    status: ACTIVE


  # ----------------------------------------------------------
  # EMPLOYEE 03
  # ----------------------------------------------------------

  - employee_id: EMP-003
    username: employee03
    display_name: Employee 3

    department: IT
    role: IT_Admin

    workstation_id: END-03

    access_profile: it_admin

    status: ACTIVE


  # ----------------------------------------------------------
  # EMPLOYEE 04
  # ----------------------------------------------------------

  - employee_id: EMP-004
    username: employee04
    display_name: Employee 4

    department: Sales
    role: Employee

    workstation_id: END-04

    access_profile: sales_user

    status: ACTIVE


# ============================================================
# ACCESS PROFILES
# ============================================================

access_profiles:

  # ----------------------------------------------------------
  # FINANCE USER
  # ----------------------------------------------------------

  finance_user:
    privileged: false

    allowed_assets:
      - WEB-01
      - DB-01
      - CLOUD-01

    restricted_resources:
      - HR_DATA
      - IT_ADMIN
      - SYSTEM_CONFIGURATION


  # ----------------------------------------------------------
  # HR USER
  # ----------------------------------------------------------

  hr_user:
    privileged: false

    allowed_assets:
      - WEB-01
      - CLOUD-01

    restricted_resources:
      - FINANCE_DATA
      - IT_ADMIN
      - DATABASE_ADMIN


  # ----------------------------------------------------------
  # IT ADMIN
  # ----------------------------------------------------------

  it_admin:
    privileged: true

    allowed_assets:
      - WEB-01
      - DB-01
      - CLOUD-01

    restricted_resources: []


  # ----------------------------------------------------------
  # SALES USER
  # ----------------------------------------------------------

  sales_user:
    privileged: false

    allowed_assets:
      - WEB-01
      - CLOUD-01

    restricted_resources:
      - FINANCE_DATA
      - HR_DATA
      - IT_ADMIN


# ============================================================
# CLOUD RESOURCE REGISTRY
# ============================================================

cloud_resources:

  # ----------------------------------------------------------
  # CLOUD VM
  # ----------------------------------------------------------

  - resource_id: CLOUD-VM-01
    resource_type: virtual_machine

    parent_asset: CLOUD-01

    ip_address: 10.10.1.41

    os: Ubuntu

    criticality: HIGH
    status: ACTIVE


  # ----------------------------------------------------------
  # CLOUD STORAGE
  # ----------------------------------------------------------

  - resource_id: STORAGE-01
    resource_type: object_storage

    parent_asset: CLOUD-01

    purpose: Enterprise files

    data_classification: INTERNAL

    criticality: HIGH
    status: ACTIVE


  # ----------------------------------------------------------
  # IDENTITY AND ACCESS MANAGEMENT
  # ----------------------------------------------------------

  - resource_id: IAM-01
    resource_type: identity_management

    parent_asset: CLOUD-01

    criticality: CRITICAL
    status: ACTIVE


  # ----------------------------------------------------------
  # CLOUD API
  # ----------------------------------------------------------

  - resource_id: API-01
    resource_type: cloud_api

    parent_asset: CLOUD-01

    criticality: HIGH
    status: ACTIVE


  # ----------------------------------------------------------
  # SECURITY CONFIGURATION
  # ----------------------------------------------------------

  - resource_id: SEC-01
    resource_type: security_configuration

    parent_asset: CLOUD-01

    criticality: HIGH
    status: ACTIVE